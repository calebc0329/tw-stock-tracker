name: 台股智能買賣時機點巡檢 (交易日 10:00, 12:00, 14:00)

on:
  schedule:
    # 02:00, 04:00, 06:00 UTC 對應台北時間 (UTC+8) 10:00, 12:00, 14:00，每週一至週五
    - cron: '0 2,4,6 * * 1-5'
  workflow_dispatch: # 支援手動在 GitHub 網頁上點擊「Run workflow」隨時觸發測試

jobs:
  daily-alert:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行盤後分析並推播至 LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DASHBOARD_URL: "https://tw-stock-tracker-klbx9enyxbnwlfs8ztvapa.streamlit.app/"
          NOTIFY_ONLY_ON_SIGNALS: "true"
        run: |
          python daily_alert.py
